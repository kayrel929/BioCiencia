[package]
name = "biociencia"
version = "0.1.0"
description = "BioCiencia – Plataforma Inteligente de Investigación Científica Colaborativa"
edition = "2021"
rust-version = "1.77"

[lib]
name = "biociencia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
biociencia-db = { path = "db" }


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
